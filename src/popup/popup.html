<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jev Focus</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { width: 260px; margin: 0; padding: 18px; background: #121318; color: #f7f7f8; }
      h1 { margin: 0 0 5px; font-size: 17px; } p { color: #a5a6af; margin: 0 0 16px; font-size: 12px; line-height: 1.4; }
      label { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 12px 0; border-top: 1px solid #292b34; }
      input { accent-color: #8e78e9; width: 18px; height: 18px; }
      button { width: 100%; margin-top: 8px; padding: 9px; border: 1px solid #343640; border-radius: 9px; color: #fff; background: #202128; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>Jev Focus</h1>
    <p id="summary">Loading your focus settings…</p>
    <label><span>Focus mode</span><input id="focusMode" type="checkbox"></label>
    <button id="settings" type="button">Open settings</button>
    <script src="popup.js"></script>
  </body>
</html>
